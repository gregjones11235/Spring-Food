services:


  db:
    image: postgres:15.2-alpine
    environment:
      POSTGRES_DB: onlineorder
      POSTGRES_PASSWORD: secret
    # 慢 SQL 观测：pg_stat_statements 统计、超过 100ms 的语句写日志、记录锁等待、统计 IO 耗时
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c log_min_duration_statement=100
      -c log_lock_waits=on
      -c track_io_timing=on
    volumes:
      - onlineorder-pg-local:/var/lib/postgresql/data
    ports:
      - "5432:5432"


  # 单节点集群模式，和线上 ElastiCache Serverless 保持一致（跨 slot 的多 key 命令同样会报 CROSSSLOT）。
  # 主业务用它做二级缓存，挂掉时自动降级到本地缓存 + 数据库；/lab/redis 实验也用它。
  # cluster-announce-ip 让集群拓扑里返回 127.0.0.1，宿主机上的后端才能按拓扑连回来；
  # 启动后在后台把 16384 个 slot 全部分给这个节点（容器重启后 slot 已分配，报错可忽略）。
  redis:
    image: redis:7.4-alpine
    command:
      - sh
      - -c
      - >-
        (until redis-cli ping > /dev/null 2>&1; do sleep 0.2; done;
        redis-cli cluster addslotsrange 0 16383 > /dev/null) &
        exec redis-server --cluster-enabled yes --cluster-config-file /data/nodes.conf
        --cluster-announce-ip 127.0.0.1 --save '' --appendonly no
    ports:
      - "6379:6379"


volumes:
  onlineorder-pg-local:
